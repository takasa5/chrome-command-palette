name: merge-gate

# PR を人間がレビューせずに自動でマージしてよいかを決め、head の commit に `merge-gate` の status を付ける。
#   success: 自動でマージしてよい
#   pending: 人間が見る。リポジトリの持ち主が merge-gate のコメントのチェックボックスを付けるか、
#            `/approve <SHA>` とコメントすると success になる
# 判定のしかたは .github/merge-gate/ にある。
#
# pull_request_target と issue_comment は、どちらも base ブランチのワークフローで動く。
# PR の中でこのファイルや .github/merge-gate/ を書き換えても、その PR の判定には効かない。
# PR のコードは checkout も実行もせず、中身は API で読むだけにする。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  # パスで分類する。LLM も secret も使わない。
  classify:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/approve')) ||
      (github.event.issue.pull_request &&
       github.event.action == 'edited' &&
       github.event.sender.login == github.repository_owner &&
       github.event.comment.user.login == 'github-actions[bot]' &&
       startsWith(github.event.comment.body, '<!-- merge-gate -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      need_llm: ${{ steps.classify.outputs.need_llm }}
      eligible: ${{ steps.classify.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: classify
        run: node .github/merge-gate/run.js classify
        env:
          GH_TOKEN: ${{ github.token }}

  # コードの変更を LLM が判定する。Claude のトークンを使うので、リポジトリの持ち主の PR で、持ち主が動かしたときだけ動く。
  # Claude にはツールを一切使わせず、GitHub のトークンも渡さない。答えは JSON で受け取るだけ。
  # モデルは Haiku。判断が分かれそうな 12 のケースで Sonnet と同じ判定になり、使用量は 1/16 ほどだった。
  judge:
    needs: classify
    if: >-
      needs.classify.outputs.need_llm == 'true' &&
      needs.classify.outputs.eligible == 'true' &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # バージョンと中身のハッシュは .github/merge-gate/claude/package-lock.json で固定し、Dependabot で更新を追う。
      # pull_request_target で checkout するのは base ブランチなので、PR の中で lockfile を書き換えてもこの判定には効かない。
      # Claude Code は postinstall で本体のバイナリを用意する。npm 11.19 からは install スクリプトを既定で動かさないので、
      # 許可は .github/merge-gate/claude/package.json の allowScripts に書く（プロジェクト内の install では --allow-scripts が使えない）。
      - name: Claude Code を入れる
        run: |
          npm ci --prefix .github/merge-gate/claude
          echo "$PWD/.github/merge-gate/claude/node_modules/.bin" >> "$GITHUB_PATH"
          .github/merge-gate/claude/node_modules/.bin/claude --version
      - name: LLM に渡す入力を作る
        run: node .github/merge-gate/run.js prepare > "$RUNNER_TEMP/input.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Claude で判定する
        continue-on-error: true
        run: >-
          claude -p
          --model haiku
          --tools ""
          --strict-mcp-config
          --setting-sources ""
          --no-session-persistence
          --system-prompt-file .github/merge-gate/prompt.md
          --output-format json
          --json-schema "$(node .github/merge-gate/run.js schema)"
          < "$RUNNER_TEMP/input.md" > "$RUNNER_TEMP/verdict.json"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - id: verdict
        if: always()
        run: node .github/merge-gate/run.js verdict "$RUNNER_TEMP/verdict.json"

  # パスの分類と LLM の判定を合わせ、status とコメントを書く。LLM は使わない。
  decide:
    needs: [classify, judge]
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      automerge: ${{ steps.decide.outputs.automerge }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: decide
        run: node .github/merge-gate/run.js decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.judge.outputs.verdict }}
          JUDGE_RESULT: ${{ needs.judge.result }}

  # dependabot の PR が通ったら（マイナー更新か、持ち主が /approve したとき）、auto-merge をオンにする。
  # マージは CI と merge-gate が通ったあとに GitHub がする。checkout はせず、gh で API を呼ぶだけ。
  # GITHUB_TOKEN でマージするので、main への push で動くワークフローはこのマージでは動かない。
  # always() がないと、上流の judge がスキップされたとき（dependabot の PR や /approve の後など）にこのジョブもスキップされる。
  automerge:
    needs: decide
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.automerge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge "$PR" --repo "$REPO" --auto --merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
