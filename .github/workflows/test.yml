name: test

on:
  push:
    branches: [main]
  pull_request:

# npm ci で入れたパッケージや action が動くので、トークンは読むだけにする。
permissions:
  contents: read

# test と e2e は main の必須チェックなので、paths-ignore でワークフローごと止めるとチェックが来ずにマージできなくなる。
# ワークフローは毎回動かし、関係ないファイルしか変えていない PR では job を skip する。skip した job は必須チェックを満たす。
# changes が失敗したときは出力が空になるので、skip せずにテストを動かす。
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # main への push は常に全部動かす
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename' > files.txt
          cat files.txt
          # どのテストにも効かないファイル。ここに無いファイルが 1 つでも変わればテストを動かす
          unrelated='^(\.claude/|docs/|scripts/demo/|README(\.ja)?\.md$|CLAUDE\.md$|PRIVACY(\.ja)?\.md$|\.gitignore$|\.github/dependabot\.yml$|\.github/workflows/(palette-diagram|actions-lock|release)\.yml$|\.github/workflows/actions\.lock$)'
          # e2e は拡張機能の画面を見るので、単体テスト、ストア用のスクリプト、merge-gate だけの変更でも要らない
          unit_only='^(tests/|scripts/store/|\.github/merge-gate/)'
          if grep -Eqv "$unrelated" files.txt; then test=true; else test=false; fi
          if grep -Ev "$unrelated" files.txt | grep -Eqv "$unit_only"; then e2e=true; else e2e=false; fi
          echo "test=$test" | tee -a "$GITHUB_OUTPUT"
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # palette.md と paths.json がモデルから作り直したものと一致するか
      - run: npm run model
      - run: git diff --exit-code -- e2e/graph/generated

  # Chromium と Edge で同じ E2E を並列に流す。
  # matrix のジョブはチェック名が「e2e-browser (chromium)」のようになり、skip したときは展開されない名前で届く。
  # 必須チェックの名前を変えずに済むよう、必須チェックには下の e2e ジョブで結果をまとめて報告する。
  e2e-browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # 片方で落ちても、もう片方の結果を見られるようにする
      fail-fast: false
      matrix:
        channel: [chromium, msedge]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps ${{ matrix.channel }}
      - run: npm run e2e
        env:
          E2E_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.channel }}
          path: e2e/.output/
          # 失敗したテストの画面（e2e/.output/ のスクリーンショット）を上げて、CI で落ちた原因を後から見られるようにする
          include-hidden-files: true

  # main の必須チェック。e2e-browser がどのブラウザでも通ったか、変更が E2E に関係なく skip したときだけ成功にする。
  # e2e-browser が失敗、キャンセルしたときに必須チェックが skip で届いて満たされないよう、always() で必ず動かす。
  e2e:
    needs: [changes, e2e-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.e2e-browser.result }}
        run: |
          echo "e2e-browser: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]
