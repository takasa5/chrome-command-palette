name: test

on:
  push:
    branches: [main]
  pull_request:

# npm ci で入れたパッケージや action が動くので、トークンは読むだけにする。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # palette.md と paths.json がモデルから作り直したものと一致するか
      - run: npm run model
      - run: git diff --exit-code -- e2e/graph/generated

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e/.output/
