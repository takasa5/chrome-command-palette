version: 2
updates:
  # uses: と actions.lock を一緒に更新する
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 侵害されたリリースは数日で見つかって取り下げられることが多いので、公開から 7 日待ってから取り込む。
    # マイナー更新は merge-gate が人のレビューなしで通すので、待つのはここでしかできない。
    # 脆弱性を直すセキュリティ更新は待たない。
    cooldown:
      default-days: 7
  # テストと E2E で使う Quint と playwright-core。公開から 7 日待ってから取り込む。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # デモ GIF を作る playwright-core。公開から 7 日待ってから取り込む。
  - package-ecosystem: npm
    directory: /scripts/demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
