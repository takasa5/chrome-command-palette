<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>コマンドパレット</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="palette.css" />
    <script src="redirect.js"></script>
    <script type="module" src="palette.js"></script>
  </head>
  <body>
    <main class="palette">
      <div id="breadcrumb" hidden></div>
      <input
        id="query"
        autofocus
        type="text"
        placeholder="コマンド、タブ、ブックマーク、履歴を検索"
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-expanded="true"
        aria-controls="results"
        aria-label="コマンドパレット"
      />
      <ul id="results" role="listbox"></ul>
      <footer>
        <span><kbd>↑</kbd><kbd>↓</kbd> 移動</span>
        <span><kbd>Enter</kbd> 実行</span>
        <span><kbd>⌫</kbd> フォルダを戻る</span>
        <span><kbd>Esc</kbd> 閉じる</span>
        <output id="toast"></output>
      </footer>
    </main>
  </body>
</html>
