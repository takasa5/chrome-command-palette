<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1120px; height: 800px; overflow: hidden; }
body {
  position: relative;
  background: #0b0d16;
  color: #fff;
  font: 16px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
}
.glow {
  position: absolute; inset: 0;
  background: radial-gradient(760px 420px at 18% -8%, #2c3f8f 0%, transparent 70%), radial-gradient(640px 400px at 92% 0%, #55308a 0%, transparent 70%);
  opacity: .55;
}
.head { position: absolute; left: 80px; right: 80px; top: 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 7px; color: #aab3d0; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.brand img { width: 16px; height: 16px; }
#caption { margin-top: 4px; font-size: 30px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
#keys { display: flex; gap: 8px; transform-origin: right center; }
.key {
  min-width: 52px; height: 52px; padding: 0 14px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(#f5f6fb, #d7daea);
  border-radius: 11px;
  box-shadow: 0 4px 0 #8d93b3;
  color: #171a2b; font-size: 22px; font-weight: 700;
}
.window {
  position: absolute; left: 80px; top: 100px; width: 960px; height: 700px;
  overflow: hidden;
  background: #18181b;
  border: 1px solid #3b3e52; border-bottom: 0;
  border-radius: 14px 14px 0 0;
}
.strip { height: 40px; display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; background: #101116; }
.lights { display: flex; gap: 7px; align-self: center; margin: 0 12px 0 4px; }
.lights i { width: 11px; height: 11px; border-radius: 50%; }
.tab {
  flex: 0 1 172px; min-width: 0; height: 32px; padding: 0 12px;
  display: flex; align-items: center; gap: 7px;
  border-radius: 9px 9px 0 0;
  color: #9a9ca8; font-size: 12px;
}
.tab.active { background: #26272d; color: #f0f0f5; }
.tab img { flex: none; width: 14px; height: 14px; }
.tab span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bar { height: 33px; display: flex; align-items: center; padding: 0 14px; background: #26272d; border-bottom: 1px solid #101116; }
#url { width: 100%; height: 23px; padding: 0 12px; display: flex; align-items: center; background: #17181c; border-radius: 12px; color: #b6b8c4; font-size: 12px; }
#page { display: block; width: 960px; height: 627px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="head">
  <div>
    <div class="brand"><img id="logo" alt="" />Command Palette</div>
    <div id="caption"></div>
  </div>
  <div id="keys"></div>
</div>
<div class="window">
  <div class="strip">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div id="tabs" style="display:contents"></div>
  </div>
  <div class="bar"><div id="url"></div></div>
  <img id="page" alt="" />
</div>
<script>
window.draw = async ({ shot, caption, keys = [], keyScale = 1, pageOpacity = 1, pageScale = 1, tabs, favicons, logo }) => {
  document.getElementById("logo").src = logo;
  document.getElementById("caption").textContent = caption;
  const keysEl = document.getElementById("keys");
  keysEl.replaceChildren(...keys.map((k) => Object.assign(document.createElement("div"), { className: "key", textContent: k })));
  keysEl.style.transform = `scale(${keyScale})`;
  const page = document.getElementById("page");
  page.src = shot;
  page.style.opacity = pageOpacity;
  page.style.transform = `scale(${pageScale})`;
  const tabsEl = document.getElementById("tabs");
  tabsEl.replaceChildren(...tabs.map((tab) => {
    const el = document.createElement("div");
    el.className = "tab" + (tab.active ? " active" : "");
    const img = document.createElement("img");
    img.src = tab.url.startsWith("http") ? favicons[tab.url] : logo;
    const label = document.createElement("span");
    label.textContent = tab.url.startsWith("http") ? tab.title : "Command Palette";
    el.append(img, label);
    return el;
  }));
  const active = tabs.find((tab) => tab.active);
  document.getElementById("url").textContent = active.url.startsWith("http") ? active.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "") : "Command Palette  |  palette.html";
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
};
</script>
</body>
</html>
